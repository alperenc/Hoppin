# Minimal local Supabase config, used only to run the local Postgres +
# pgTAP test stack (`npm run test:db`, `supabase test db`) against
# supabase/migrations/. This project has no hosted-Supabase CLI workflow
# (migrations are applied via the Supabase dashboard/SQL editor); this file
# exists purely to support local RLS/trigger regression testing per issue #44.
#
# Full reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "hoppin"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[realtime]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

[edge_runtime]
enabled = false

[analytics]
enabled = false
